app:
  github:
    timeout: ${GITHUB_REQUEST_TIMEOUT:10}
    api_url: "https://api.github.com"
    update-threshold: ${GITHUB_UPDATE_THRESHOLD:1}
  stackoverflow:
    timeout: ${STACKOVERFLOW_REQUEST_TIMEOUT:10}
    api-url: "https://api.stackexchange.com/2.3"

data:
  access-type: ${DB_ACCESS_TYPE:ORM}

spring:
  application:
    name: Scrapper
  liquibase:
    enabled: true
    change-log: file:./migrations/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/scrappers
    username: postgres
    password: root

server:
  port: ${SCRAPPER_PORT:8081}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

bot:
  api:
    base-url: ${BOT_API_BASE_URL:http://localhost:8080}

scrapper:
  interval: ${SCRAPPER_INTERVAL:60000}
