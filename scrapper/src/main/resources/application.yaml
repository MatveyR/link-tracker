app:
  github-token: ${GITHUB_TOKEN}
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

bot:
  api:
    base-url: ${BOT_API_BASE_URL}

scrapper:
  interval: ${SCRAPPER_INTERVAL}
