databaseChangeLog:
  - changeSet:
      id: 4
      author: Matvey Rudinskiy
      changes:
        - addColumn:
            tableName: subscriptions
            columns:
              - column:
                  name: tags
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: filters
                  type: TEXT
                  constraints:
                    nullable: true

              - dropForeignKeyConstraint:
                  baseTableName: subscription_tags
                  constraintName: fk_subscription_tags_subscription
                  ifExists: true

              - dropForeignKeyConstraint:
                  baseTableName: subscription_filters
                  constraintName: fk_subscription_filters_subscription
                  ifExists: true

              - dropTable:
                  tableName: subscription_tags
                  ifExists: true

              - dropTable:
                  tableName: subscription_filters
                  ifExists: true

            rollback:
              - createTable:
                  tableName: subscription_tags
                  columns:
                    - column:
                        name: subscription_id
                        type: BIGINT
                    - column:
                        name: tag
                        type: VARCHAR(255)

              - createTable:
                  tableName: subscription_filters
                  columns:
                    - column:
                        name: subscription_id
                        type: BIGINT
                    - column:
                        name: filter
                        type: VARCHAR(255)

              - dropColumn:
                  tableName: subscriptions
                  columnName: tags

              - dropColumn:
                  tableName: subscriptions
                  columnName: filters
