version: '3.8'

services:
  scrapper:
    build:
      context: ./scrapper
      dockerfile: Dockerfile
    container_name: scrapper-app
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=Scrapper
      - BOT_API_BASE_URL=http://bot:8080
      - SCRAPPER_INTERVAL=100000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SO_TOKEN_KEY=${SO_TOKEN_KEY}
      - SO_ACCESS_TOKEN=${SO_ACCESS_TOKEN}
    ports:
      - "8081:8081"
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=Bot
      - SCRAPPER_API_BASE_URL=http://scrapper:8081
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      - scrapper
    restart: unless-stopped
